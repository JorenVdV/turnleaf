name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-android-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Run web quality gates
        run: npm run verify

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Build legacy WebView bundle
        env:
          TURNLEAF_LEGACY_WEBVIEW: '1'
        run: |
          set -eu
          npx vite build
          if grep -l '@layer' dist/assets/*.css; then
            echo "Legacy WebView CSS still contains cascade layers" >&2
            exit 1
          fi

  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run android:debug

      - name: Launch emulator and smoke test app startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          profile: Nexus 5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-animations: true
          script: npm run android:smoke
