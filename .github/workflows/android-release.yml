name: Android APK Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_version.outputs.release_tag }}
      version_base: ${{ steps.release_version.outputs.version_base }}
      tested_revision: ${{ steps.release_version.outputs.tested_revision }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Derive release version
        id: release_version
        run: |
          set -eu
          BASE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_VERSION="${BASE_VERSION}+${GITHUB_RUN_NUMBER}"
          # This repository's run numbers restarted at 1, below the versionCodes of earlier
          # upstream and local builds (117+). Android refuses to update an app to a lower
          # versionCode, so offset them to stay above every build already in the field.
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "TURNLEAF_VERSION_BASE=${BASE_VERSION}" >> "$GITHUB_ENV"
          echo "TURNLEAF_VERSION_NAME=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "TURNLEAF_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "TURNLEAF_RELEASE_TAG=v${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "release_tag=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_base=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tested_revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Finalize release notes
        run: npm run release:finalize

      - name: Run release quality gates
        run: |
          npm run verify
          npm run android:debug

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD secret" >&2
            exit 1
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "Missing ANDROID_KEY_ALIAS secret" >&2
            exit 1
          fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Missing ANDROID_KEY_PASSWORD secret" >&2
            exit 1
          fi
          base64 --decode <<<"$ANDROID_KEYSTORE_BASE64" > android/turnleaf-release.jks
          cat > android/keystore.properties <<EOF
          TURNLEAF_STORE_FILE=turnleaf-release.jks
          TURNLEAF_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          TURNLEAF_KEY_ALIAS=$ANDROID_KEY_ALIAS
          TURNLEAF_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: npm run android:release

      - name: Stage release APK
        run: |
          set -eu
          mkdir -p release-payload
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" release-payload/app-release.apk

      # Same app id and signing key as the release APK, so either one updates the other. The
      # asset names are what src/lib/github/releases.ts offers each variant in its update banner.
      - name: Build signed legacy WebView APK
        env:
          TURNLEAF_LEGACY_WEBVIEW: '1'
        run: npm run android:release

      - name: Stage legacy WebView APK
        run: |
          set -eu
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          if unzip -p "$APK" 'assets/public/assets/*.css' | grep -q '@layer'; then
            echo "Legacy WebView APK still contains cascade layers" >&2
            exit 1
          fi
          cp "$APK" release-payload/turnleaf-legacy-webview.apk

      - name: Stage release notes
        run: |
          set -eu
          npm run --silent release:notes > "$RUNNER_TEMP/turnleaf-release-notes.md"
          {
            cat "$RUNNER_TEMP/turnleaf-release-notes.md"
            printf '\n\n## Downloads\n\n'
            printf -- '- `app-release.apk`: Android 7 or newer with an up-to-date Android System WebView.\n'
            printf -- '- `turnleaf-legacy-webview.apk`: devices whose WebView cannot be updated past Chrome 86, such as Onyx Boox on Android 9.\n'
            printf '\nTested revision: `%s`\n' "$GITHUB_SHA"
          } > release-payload/turnleaf-release-notes.md
          printf '%s\n' "$GITHUB_SHA" > release-payload/tested-revision.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: turnleaf-release
          path: release-payload
          if-no-files-found: error

  publish-github-release:
    needs: build-release-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download tested release artifacts
        uses: actions/download-artifact@v8
        with:
          name: turnleaf-release
          path: release-payload

      - name: Verify release provenance
        env:
          TESTED_REVISION: ${{ needs.build-release-apk.outputs.tested_revision }}
        run: |
          set -eu
          test "$(cat release-payload/tested-revision.txt)" = "$TESTED_REVISION"
          grep -Fq "Tested revision: \`$TESTED_REVISION\`" release-payload/turnleaf-release-notes.md
          test -s release-payload/app-release.apk
          test -s release-payload/turnleaf-legacy-webview.apk
          # GitHub lists assets alphabetically, and builds before the per-variant update check
          # offer the first .apk: that has to stay the normal one.
          FIRST_APK="$(cd release-payload && printf '%s\n' *.apk | LC_ALL=C sort | head -n 1)"
          if [ "$FIRST_APK" != "app-release.apk" ]; then
            echo "Release assets sort $FIRST_APK first; app-release.apk must come first" >&2
            exit 1
          fi
          if cmp -s release-payload/app-release.apk release-payload/turnleaf-legacy-webview.apk; then
            echo "Release and legacy WebView APKs are identical" >&2
            exit 1
          fi
          test -s release-payload/turnleaf-release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-release-apk.outputs.release_tag }}
          VERSION_BASE: ${{ needs.build-release-apk.outputs.version_base }}
          TESTED_REVISION: ${{ needs.build-release-apk.outputs.tested_revision }}
        run: |
          gh release create "$RELEASE_TAG" "release-payload/app-release.apk" \
            "release-payload/turnleaf-legacy-webview.apk" \
            --title "Turnleaf $VERSION_BASE" \
            --notes-file "release-payload/turnleaf-release-notes.md" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TESTED_REVISION"
